# Databricks Apps runtime configuration.
# Databricks routes traffic to port 8000, so Streamlit must listen there.
command:
  - "streamlit"
  - "run"
  - "app.py"
  - "--server.port=8000"
  - "--server.address=0.0.0.0"

env:
  # Name of the Lakebase database instance this app connects to.
  # Set the value to YOUR instance name (see DEPLOY.md, step 3).
  - name: "LAKEBASE_INSTANCE_NAME"
    value: "support-lakebase"
  - name: "PGDATABASE"
    value: "databricks_postgres"
  # NOTE: PGHOST is intentionally NOT set here. db.py resolves the instance's
  # read/write DNS through the SDK from LAKEBASE_INSTANCE_NAME above, which
  # keeps this file free of environment-specific hostnames. If you prefer to
  # pin it, set PGHOST in the app's own Environment settings rather than here.
  - name: "PGSSLMODE"
    value: "require"
  - name: "STREAMLIT_GATHER_USAGE_STATS"
    value: "false"
  # NOTE: PGPASSWORD is intentionally NOT set here. The app mints a short-lived
  # OAuth token at runtime via the Databricks SDK, so no secret is stored.
